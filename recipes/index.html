<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forever Recipe Codex</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#0f1116;--bg2:#161a22;--panel:#1b202b;--panel2:#232a37;--line:#2c3443;--line2:#3b4558;
  --text:#d9d3c3;--muted:#8f8a7c;--gold:#d4aa4d;--gold2:#f0cc73;--gold3:#8a6a25;
  --q0:#9d9d9d;--q1:#f2f2f2;--q2:#1eff00;--q3:#0070dd;--q4:#a335ee;--q5:#ff8000;--q6:#e6cc80;--q7:#00ccff;
  --green:#7fd67a;--grey:#8f8a7c;
  --disp:"Cinzel",Georgia,serif;--sans:"Source Sans 3","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--sans);padding-inline:16px;padding-block:0 32px;
  background-image:radial-gradient(1200px 500px at 50% -120px,rgba(212,170,77,.13),transparent 65%),linear-gradient(var(--bg),var(--bg))}
a{color:var(--gold2)}
header{padding-block:26px 14px;border-bottom:1px solid var(--gold3);display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .eyebrow{font:600 11px var(--disp);letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
h1{margin:0;font:700 30px/1.05 var(--disp);letter-spacing:.03em;color:var(--gold2);text-shadow:0 0 18px rgba(212,170,77,.25)}
.brand .sub{color:var(--muted);font-size:13px;margin-top:6px}
.brand .sub b{color:var(--text);font-family:var(--mono);font-weight:500}
.stats{display:flex;gap:18px;color:var(--muted);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
.stats b{display:block;font:600 22px var(--disp);color:var(--gold2);letter-spacing:0;text-transform:none}
nav.profs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:6px;padding-block:12px;border-bottom:1px solid var(--line)}
.ptab{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:1px solid var(--line2);border-radius:4px;background:var(--panel);color:var(--text);cursor:pointer;font:600 13px var(--sans)}
.ptab img{width:24px;height:24px;border-radius:3px;border:1px solid #000}
.ptab .n{color:var(--muted);font-family:var(--mono);font-size:11px;font-weight:500}
.ptab.on{border-color:var(--gold);background:linear-gradient(180deg,#2a2412,#1b202b);color:var(--gold2)}
.ptab:focus-visible,.bar :focus-visible,.card:focus-visible,summary:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:12px 4px}
.bar input[type=search]{flex:1 1 240px;min-width:180px;padding:8px 11px;border:1px solid var(--line2);border-radius:4px;background:var(--panel);color:var(--text);font:inherit}
.bar label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;white-space:nowrap}
.bar select,.bar input[type=number]{padding:6px 8px;border:1px solid var(--line2);border-radius:4px;background:var(--panel);color:var(--text);font:inherit}
.bar input[type=number]{width:70px;font-family:var(--mono)}
.count{margin-left:auto;color:var(--muted);font-size:13px}.count b{color:var(--text);font-family:var(--mono);font-weight:500}
h2.prof{font:600 22px var(--disp);color:var(--gold2);margin:26px 0 4px;display:flex;align-items:center;gap:12px}
h2.prof img{width:34px;height:34px;border-radius:4px;border:1px solid var(--gold3)}
h2.prof .n{font:500 13px var(--mono);color:var(--muted)}
details.group{margin-top:12px;border:1px solid var(--line);border-radius:6px;background:var(--bg2)}
details.group>summary{cursor:pointer;list-style:none;padding:9px 14px;font:600 12.5px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary::before{content:"▸";color:var(--gold3);font-size:14px;transition:transform .15s}
details.group[open]>summary::before{transform:rotate(90deg)}
details.group>summary .n{margin-left:auto;font:500 11px var(--mono);color:var(--muted);letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px;padding:0 12px 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;grid-template-columns:44px 1fr;gap:6px 10px;cursor:pointer}
.card:hover,.card.sel{border-color:var(--gold3);background:var(--panel2)}
.card .ico{width:44px;height:44px;border-radius:4px;border:1px solid #000;box-shadow:0 0 0 1px var(--line2);background:#000}
.card .t{font-weight:600;line-height:1.2}
.card .m{color:var(--muted);font-size:12.5px;margin-top:2px}
.card .m .g{color:var(--green)}.card .m .gr{color:var(--grey)}
.q0{color:var(--q0)}.q1{color:var(--q1)}.q2{color:var(--q2)}.q3{color:var(--q3)}.q4{color:var(--q4)}.q5{color:var(--q5)}.q6{color:var(--q6)}.q7{color:var(--q7)}
.made{grid-column:1/-1;display:flex;align-items:center;gap:8px;border-top:1px dashed var(--line);padding-top:8px;font-size:13px}
.made img{width:28px;height:28px;border-radius:3px;border:1px solid #000}
.made .arrow{color:var(--gold3);font-family:var(--mono)}
.reag{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 6px}
.reag span{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:2px 6px 2px 2px}
.reag img{width:20px;height:20px;border-radius:2px;border:1px solid #000}
.reag b{color:var(--text);font-family:var(--mono);font-weight:500}
.empty{padding:50px;text-align:center;color:var(--muted)}
/* tooltip */
#tip{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 32px));max-height:min(70vh,560px);overflow:auto;background:#0b0d12;border:1px solid var(--gold3);border-radius:6px;padding:12px 14px;box-shadow:0 12px 40px rgba(0,0,0,.6);z-index:10;font-size:13px;line-height:1.35}
#tip .x{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
#tip .head{display:flex;gap:10px;align-items:center;margin-bottom:6px}
#tip .head img{width:40px;height:40px;border-radius:4px;border:1px solid #000}
#tip .t{font-size:15px;font-weight:600;padding-right:20px}
#tip p{margin:3px 0}#tip .y{color:var(--gold2)}#tip .m{color:var(--muted)}#tip .g{color:var(--q2)}#tip .w{color:var(--q1)}
#tip h4{margin:10px 0 4px;font:600 11px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
#tip .rl{display:flex;align-items:center;gap:6px;margin:2px 0}#tip .rl img{width:22px;height:22px;border-radius:2px;border:1px solid #000}
@media (max-width:600px){#tip{left:16px;right:16px;width:auto}.grid{grid-template-columns:1fr;padding:0 8px 8px}}
@media (prefers-reduced-motion:reduce){details.group>summary::before{transition:none}}
</style>
</head>

4,"n":22},{"id":14341,"name":"Rune Thread","icon":136120,"n":8}]},{"id":273994,"name":"Pattern: Pauldrons of Conviction","q":4,"icon":134940,"prof":"Tailoring","green":320,"grey":330,"skill":320,"spell":"Pauldrons of Conviction","spellDesc":"","bind":"1","ilvl":1,"made":{"id":273926,"name":"Item 273926","q":1,"icon":0,"type":"Cloth","stats":"","fx":""},"reagents":[{"id":274030,"name":"Malleable Essence of Nature","icon":132119,"n":3},{"id":14342,"name":"Mooncloth","icon":132895,"n":2},{"id":14048,"name":"Bolt of Runecloth","icon":132904,"n":16},{"id":14341,"name":"Rune Thread","icon":136120,"n":8}]},{"id":273991,"name":"Pattern: Treads of Conviction","q":4,"icon":134940,"prof":"Tailoring","green":320,"grey":330,"skill":320,"spell":"Treads of Conviction","spellDesc":"","bind":"1","ilvl":1,"made":{"id":273923,"name":"Item 273923","q":1,"icon":0,"type":"Cloth","stats":"","fx":""},"reagents":[{"id":274030,"name":"Malleable Essence of Nature","icon":132119,"n":3},{"id":14342,"name":"Mooncloth","icon":132895,"n":2},{"id":14048,"name":"Bolt of Runecloth","icon":132904,"n":16},{"id":14341,"name":"Rune Thread","icon":136120,"n":8}]}];
const QN=['Poor','Common','Uncommon','Rare','Epic','Legendary','Artifact','Heirloom'];
const BOND={'1':'Binds when picked up','2':'Binds when equipped','3':'Binds when used','4':'Quest Item'};
const PROF_ORDER=['Alchemy','Blacksmithing','Cooking','Enchanting','Engineering','First Aid','Leatherworking','Tailoring','Fishing','Herbalism','Mining','Skinning'];
const PROF_ICON={};
for(const r of DATA){ if(!PROF_ICON[r.prof]) PROF_ICON[r.prof]=r.icon; }
const ico=id=>id?ICON(id):'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
function groupOf(r){
  if(r.prof==='Enchanting'){ const m=/^Enchant ([^-]+) -/.exec(r.spell); if(m) return 'Enchant '+m[1].trim(); return r.made?r.made.type||'Crafted items':'Other'; }
  if(!r.made) return 'Other';
  return r.made.type||'Other';
}
for(const r of DATA){ r.group=groupOf(r); r.hay=[r.name,r.spell,r.spellDesc,r.made&&r.made.name,r.made&&r.made.fx,r.made&&r.made.stats,...r.reagents.map(x=>x.name)].join(' ').toLowerCase(); }
const profs=PROF_ORDER.filter(p=>DATA.some(r=>r.prof===p)).concat([...new Set(DATA.map(r=>r.prof))].filter(p=>!PROF_ORDER.includes(p)));
$('#s-rec').textContent=DATA.length; $('#s-prof').textContent=profs.length;
const st={prof:'',q:'',qual:'',minsk:null,bop:false,sel:null};
try{const s=localStorage.getItem('prof'); if(s&&profs.includes(s)) st.prof=s;}catch(e){}
const nav=$('#profs');
function drawNav(){
  nav.innerHTML=[['','All',DATA.length,0]].concat(profs.map(p=>[p,p,DATA.filter(r=>r.prof===p).length,PROF_ICON[p]])).map(([v,l,n,i])=>
    `<button type="button" class="ptab${st.prof===v?' on':''}" data-p="${esc(v)}">${i?`<img src="${ico(i)}" alt="">`:''}<span>${esc(l)}</span><span class="n">${n}</span></button>`).join('');
}
nav.onclick=e=>{const b=e.target.closest('.ptab'); if(!b) return; st.prof=b.dataset.p; try{localStorage.setItem('prof',st.prof)}catch(x){} drawNav(); render();};
$('#q').oninput=e=>{st.q=e.target.value.trim().toLowerCase(); render()};
$('#qual').onchange=e=>{st.qual=e.target.value; render()};
$('#minsk').oninput=e=>{st.minsk=e.target.value===''?null:+e.target.value; render()};
$('#onlybop').onchange=e=>{st.bop=e.target.checked; render()};
function card(r){
  const made=r.made?`<div class="made"><span class="arrow">→</span><img src="${ico(r.made.icon)}" alt=""><span class="q${r.made.q}">${esc(r.made.name)}</span><span class="m" style="color:var(--muted)">${esc(r.made.type)}</span></div>`:
    `<div class="made"><span class="arrow">→</span><span>${esc(r.spell)}</span></div>`;
  const rg=r.reagents.map(x=>`<span><img src="${ico(x.icon)}" alt=""><b>${x.n}×</b>${esc(x.name)}</span>`).join('');
  const sk=r.grey?`<span class="g">green ${r.green}</span> · <span class="gr">grey ${r.grey}</span>`:`<span class="gr">skill n/a</span>`;
  return `<div class="card${st.sel===r.id?' sel':''}" data-id="${r.id}" tabindex="0"><img class="ico" src="${ico(r.icon)}" alt=""><div><div class="t q${r.q}">${esc(r.name)}</div><div class="m">${sk}${BOND[r.bind]?' · '+BOND[r.bind]:''}</div></div>${made}<div class="reag">${rg}</div></div>`;
}
function render(){
  const list=DATA.filter(r=>(!st.prof||r.prof===st.prof)&&(!st.qual||r.q==st.qual)&&(st.minsk===null||r.grey>=st.minsk)&&(!st.bop||r.bind==='1')&&(!st.q||r.hay.includes(st.q)));
  $('#cnt').textContent=list.length; $('#s-shown').textContent=list.length; $('#empty').hidden=list.length>0;
  const byProf=new Map(); for(const r of list){ if(!byProf.has(r.prof)) byProf.set(r.prof,new Map()); const g=byProf.get(r.prof); if(!g.has(r.group)) g.set(r.group,[]); g.get(r.group).push(r); }
  let html='';
  for(const p of profs){ const g=byProf.get(p); if(!g) continue;
    html+=`<h2 class="prof"><img src="${ico(PROF_ICON[p])}" alt="">${esc(p)}<span class="n">${[...g.values()].reduce((a,b)=>a+b.length,0)}</span></h2>`;
    const groups=[...g.entries()].sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0]));
    for(const [name,rs] of groups){ rs.sort((a,b)=>a.grey-b.grey||a.name.localeCompare(b.name));
      html+=`<details class="group" open><summary>${esc(name)}<span class="n">${rs.length}</span></summary><div class="grid">${rs.map(card).join('')}</div></details>`; }
  }
  $('#main').innerHTML=html;
}
$('#main').onclick=e=>{const c=e.target.closest('.card'); if(c) show(+c.dataset.id)};
$('#main').onkeydown=e=>{const c=e.target.closest('.card'); if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault(); show(+c.dataset.id)}};
function show(id){
  const r=DATA.find(x=>x.id===id); if(!r) return; st.sel=id;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('sel',+c.dataset.id===id));
  const t=$('#tip'); t.hidden=false;
  const m=r.made;
  t.innerHTML=`<button class="x" type="button" aria-label="Close">×</button>
    <div class="head"><img src="${ico(r.icon)}" alt=""><div><div class="t q${r.q}">${esc(r.name)}</div><div class="m">${esc(r.prof)} · Item ${r.id}${BOND[r.bind]?' · '+BOND[r.bind]:''}</div></div></div>
    ${r.grey?`<p class="m">Skill: <span class="g">green at ${r.green}</span>, <span class="w">grey at ${r.grey}</span></p>`:''}
    <p class="g">Use: Teaches you how to ${r.prof==='Enchanting'&&!m?'cast':'make'} ${esc(r.spell)}.</p>
    ${r.spellDesc?`<p class="y">${esc(r.spellDesc)}</p>`:''}
    ${m?`<h4>Creates</h4><div class="rl"><img src="${ico(m.icon)}" alt=""><span class="q${m.q}">${esc(m.name)}</span><span class="m">${esc(m.type)}</span></div>
      ${m.stats?m.stats.split('; ').map(s=>{const i=s.lastIndexOf(':');return `<p class="w">+${esc(s.slice(i+1))} ${esc(s.slice(0,i))}</p>`}).join(''):''}
      ${m.fx?m.fx.split(' || ').map(l=>`<p class="g">${esc(l)}</p>`).join(''):''}`:''}
    <h4>Reagents</h4>${r.reagents.map(x=>`<div class="rl"><img src="${ico(x.icon)}" alt=""><span>${esc(x.name)}</span><span class="m">× ${x.n}</span></div>`).join('')}`;
  t.querySelector('.x').onclick=()=>{t.hidden=true; st.sel=null; document.querySelectorAll('.card.sel').forEach(c=>c.classList.remove('sel'))};
}
drawNav(); render();
</script>
