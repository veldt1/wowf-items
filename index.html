<style>

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}

.chips{display:flex;flex-wrap:wrap;gap:4px}

.chip.on{background:var(--panel2);color:var(--qc);border-color:var(--qc);font-weight:600}
.chip:focus-visible,.bar :focus-visible,th:focus-visible,tr:focus-visible,.more:focus-visible{outline:2px solid var(--accent2);outline-offset:1px}
.count{color:var(--muted);font-size:13px;margin-left:auto;font-variant-numeric:tabular-nums}
.count b{color:var(--text);font-family:var(--mono);font-weight:500}
.wrap{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;min-width:900px;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;text-align:left;font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg);padding:8px 8px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
th.s::after{content:" ▾";color:var(--accent)}th.s.asc::after{content:" ▴"}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.r{cursor:pointer}tr.r:hover td{background:var(--panel2)}tr.r.sel td{background:var(--panel2);box-shadow:inset 3px 0 var(--accent)}
td.id,td.n{font-family:var(--mono);font-size:12px;color:var(--muted)}
td.name{font-weight:600;white-space:nowrap}

td.stats{color:var(--muted);font-size:13px}td.stats span{color:var(--text);white-space:nowrap}
.more{display:block;margin:14px auto;padding:8px 18px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:4px;font:inherit;cursor:pointer}
.empty{padding:40px;text-align:center;color:var(--muted)}
#card{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--accent);border-radius:6px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:10;font-size:13px}
#card .t{font-size:16px;font-weight:600;margin:0 0 2px;padding-right:24px}
#card .x{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
#card .row{display:flex;justify-content:space-between;gap:12px}
#card .m{color:var(--muted)}#card .y{color:var(--accent2)}
#card p{margin:3px 0}
#card .desc{color:var(--accent2);font-style:italic;margin-top:6px}
@media (prefers-reduced-motion:no-preference){tr.r td{transition:background .12s}}
@media (max-width:600px){#card{left:16px;right:16px;width:auto}}

const st={q:'',qual:new Set(),cls:'',slot:'',lo:null,hi:null,sort:'name',asc:true,limit:300,sel:null};

const uniq=k=>[...new Set(rows.map(r=>r[k]))].filter(Boolean).sort();

    document.querySelectorAll('th').forEach(t=>t.className='');th.className='s'+(st.asc?' asc':'');go()};

function go(){st.limit=300;

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function statsHtml(s){return statList(s).map(([n,v])=>'<span>+'+esc(v)+' '+esc(n)+'</span>').join(', ')}
function render(){$('#cnt').textContent=cur.length.toLocaleString();$('#empty').hidden=cur.length>0;$('#more').hidden=cur.length<=st.limit;
  $('#tb').innerHTML=cur.slice(0,st.limit).map(r=>'<tr class="r'+(st.sel===r.id?' sel':'')+'" data-id="'+r.id+'" tabindex="0">'

    +'<td class="n">'+r.ilvl+'</td><td class="n">'+(r.req||'')+'</td><td class="stats">'+statsHtml(r.stats)+'</td><td>'+esc(r.set)+'</td></tr>').join('')}
$('#tb').onclick=e=>{const tr=e.target.closest('tr.r');if(tr)show(+tr.dataset.id)};
$('#tb').onkeydown=e=>{const tr=e.target.closest('tr.r');if(tr&&(e.key==='Enter'||e.key===' ')){e.preventDefault();show(+tr.dataset.id)}};
const money=c=>{c=+c;if(!c)return '';const g=Math.floor(c/1e4),s=Math.floor(c%1e4/100),cp=c%100;return [g?g+'g':'',s?s+'s':'',cp?cp+'c':''].filter(Boolean).join(' ')};
function show(id){const r=rows.find(x=>x.id===id);if(!r)return;st.sel=id;
  document.querySelectorAll('tr.r').forEach(t=>t.classList.toggle('sel',+t.dataset.id===id));
  const c=$('#card');c.hidden=false;
  c.innerHTML='<button class="x" type="button" aria-label="Close">×</button><p class="t q'+r.q+'">'+esc(r.name)+'</p>'
    +'<p class="m">Item '+r.id+' · '+QN[r.q]+'</p><p class="y">Item Level '+r.ilvl+'</p>'
    +(BOND[r.bond]?'<p>'+BOND[r.bond]+'</p>':'')
    +'<p class="row"><span>'+esc(r.slot)+'</span><span>'+esc(r.sub)+'</span></p>'
    +statList(r.stats).map(([n,v])=>'<p>+'+esc(v)+' '+esc(n)+'</p>').join('')
    +(r.set?'<p class="y">'+esc(r.set)+'</p>':'')+(r.req?'<p>Requires Level '+r.req+'</p>':'')
    +(r.desc?'<p class="desc">"'+esc(r.desc)+'"</p>':'')+(r.sell?'<p class="m">Sell price: '+money(r.sell)+'</p>':'');
  c.querySelector('.x').onclick=()=>{c.hidden=true;st.sel=null;document.querySelectorAll('tr.sel').forEach(t=>t.classList.remove('sel'))}}
go();
</script>

</body>
</html>
