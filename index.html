const rows=DATA.map(r=>({id:r[0],name:r[1],q:r[2],cls:r[3],sub:r[4],slot:r[5],ilvl:r[6],req:r[7],bond:r[8],stats:r[9],set:r[10],sell:r[11],desc:r[12],fx:r[13]||'',
  hay:(r[1]+' '+r[12]+' '+r[10]+' '+r[4]+' '+(r[13]||'')).toLowerCase()}));
const $=s=>document.querySelector(s);
$('#tot').textContent=rows.length.toLocaleString();
const st={q:'',qual:new Set(),cls:'',slot:'',lo:null,hi:null,sort:'name',asc:true,limit:300,sel:null};
const qualEl=$('#qual');
QN.forEach((n,i)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=n;b.style.setProperty('--qc','var(--q'+i+')');

const uniq=k=>[...new Set(rows.map(r=>r[k]))].filter(Boolean).sort();

uniq('slot').forEach(v=>$('#slot').append(new Option(v,v)));
$('#q').oninput=e=>{st.q=e.target.value.trim().toLowerCase();go()};

$('#lo').oninput=e=>{st.lo=e.target.value===''?null:+e.target.value;go()};
$('#hi').oninput=e=>{st.hi=e.target.value===''?null:+e.target.value;go()};
document.querySelectorAll('th').forEach(th=>{th.tabIndex=0;
  const h=()=>{const k=th.dataset.k;if(st.sort===k)st.asc=!st.asc;else{st.sort=k;st.asc=!(k==='ilvl'||k==='req'||k==='q')}
    document.querySelectorAll('th').forEach(t=>t.className='');th.className='s'+(st.asc?' asc':'');go()};
  th.onclick=h;th.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();h()}}});
$('#more').onclick=()=>{st.limit+=300;render()};
let cur=[];
function go(){st.limit=300;
  cur=rows.filter(r=>(!st.qual.size||st.qual.has(r.q))&&(!st.cls||r.cls===st.cls)&&(!st.slot||r.slot===st.slot)
    &&(st.lo===null||r.ilvl>=st.lo)&&(st.hi===null||r.ilvl<=st.hi)&&(!st.q||r.hay.includes(st.q)));
  const k=st.sort,d=st.asc?1:-1;
  cur.sort((a,b)=>{const x=a[k],y=b[k];return (typeof x==='number'?x-y:String(x).localeCompare(String(y)))*d||a.id-b.id});

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const statList=s=>s?s.split('; ').map(p=>{const i=p.lastIndexOf(':');return [p.slice(0,i),p.slice(i+1)]}):[];
function statsHtml(s){return statList(s).map(([n,v])=>'<span>+'+esc(v)+' '+esc(n)+'</span>').join(', ')}
function render(){$('#cnt').textContent=cur.length.toLocaleString();$('#empty').hidden=cur.length>0;$('#more').hidden=cur.length<=st.limit;
  $('#tb').innerHTML=cur.slice(0,st.limit).map(r=>'<tr class="r'+(st.sel===r.id?' sel':'')+'" data-id="'+r.id+'" tabindex="0">'
    +'<td class="id">'+r.id+'</td><td class="name q'+r.q+'">'+esc(r.name)+'</td><td class="q'+r.q+'">'+QN[r.q]+'</td><td>'+esc(r.cls)+'</td><td>'+esc(r.sub)+'</td><td>'+esc(r.slot)+'</td>'
    +'<td class="n">'+r.ilvl+'</td><td class="n">'+(r.req||'')+'</td><td class="stats">'+statsHtml(r.stats)+'</td><td class="fx">'+fxHtml(r.fx)+'</td><td>'+esc(r.set)+'</td></tr>').join('')}
const fxHtml=s=>s?s.split(' || ').map(l=>'<div>'+esc(l)+'</div>').join(''):'';
$('#tb').onclick=e=>{const tr=e.target.closest('tr.r');if(tr)show(+tr.dataset.id)};
$('#tb').onkeydown=e=>{const tr=e.target.closest('tr.r');if(tr&&(e.key==='Enter'||e.key===' ')){e.preventDefault();show(+tr.dataset.id)}};
const money=c=>{c=+c;if(!c)return '';const g=Math.floor(c/1e4),s=Math.floor(c%1e4/100),cp=c%100;return [g?g+'g':'',s?s+'s':'',cp?cp+'c':''].filter(Boolean).join(' ')};
function show(id){const r=rows.find(x=>x.id===id);if(!r)return;st.sel=id;
  document.querySelectorAll('tr.r').forEach(t=>t.classList.toggle('sel',+t.dataset.id===id));
  const c=$('#card');c.hidden=false;
  c.innerHTML='<button class="x" type="button" aria-label="Close">×</button><p class="t q'+r.q+'">'+esc(r.name)+'</p>'
    +'<p class="m">Item '+r.id+' · '+QN[r.q]+'</p><p class="y">Item Level '+r.ilvl+'</p>'
    +(BOND[r.bond]?'<p>'+BOND[r.bond]+'</p>':'')
    +'<p class="row"><span>'+esc(r.slot)+'</span><span>'+esc(r.sub)+'</span></p>'
    +statList(r.stats).map(([n,v])=>'<p>+'+esc(v)+' '+esc(n)+'</p>').join('')
    +(r.set?'<p class="y">'+esc(r.set)+'</p>':'')+(r.req?'<p>Requires Level '+r.req+'</p>':'')
    +(r.fx?r.fx.split(' || ').map(l=>'<p class="g">'+esc(l)+'</p>').join(''):'')
    +(r.desc?'<p class="desc">"'+esc(r.desc)+'"</p>':'')+(r.sell?'<p class="m">Sell price: '+money(r.sell)+'</p>':'');
  c.querySelector('.x').onclick=()=>{c.hidden=true;st.sel=null;document.querySelectorAll('tr.sel').forEach(t=>t.classList.remove('sel'))}}
go();
</script>

</body>
</html>
